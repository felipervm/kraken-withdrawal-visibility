name: Validate withdrawal decision study
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python analysis/decision_engine.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code -- data/decision_report.json
      - run: python analysis/validate.py
      - run: python analysis/event_consistency_demo.py
